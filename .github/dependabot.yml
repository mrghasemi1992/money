# Dependency updates as pull requests (security alerts and security updates are repository
# settings, see SECURITY.md). Few PRs at a time: each one gets a preview deployment with its own
# Neon branch, and the free plan allows 10 branches (deleted when the PR closes,
# .github/workflows/delete-preview-branch.yml). A new release waits a week before Dependabot
# offers it, so a compromised version has time to be caught. Dependabot doesn't run in forks.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    commit-message:
      prefix: ci
