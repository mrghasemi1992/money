# Opens a release PR from the Conventional Commits merged into main (the version in
# package.json and CHANGELOG.md). Merging that PR tags the release and publishes it on GitHub,
# where every copy's update check finds it. See docs/releases.md.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # Only in the upstream repository: forks that self-host Money never cut releases.
    if: github.repository == 'mrghasemi1992/money'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
