# Deletes a pull request's Neon database branch when the PR is merged or closed.
#
# The Neon integration gives every preview deployment its own branch, `preview/<git branch>`,
# and never deletes it; Neon's free plan allows 10 branches per project, so after a few PRs new
# previews fail. Runs only where the repository has the `NEON_PROJECT_ID` variable and the
# `NEON_API_KEY` secret (Settings → Secrets and variables → Actions), so forks without them skip it.
# See docs/local-development.md.
name: Delete preview database branch

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  delete-branch:
    if: vars.NEON_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Delete preview/<branch> if it exists
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          # Passed through the environment, never pasted into the script: a branch name is input.
          BRANCH_NAME: preview/${{ github.event.pull_request.head.ref }}
        run: |
          if [ -z "$NEON_API_KEY" ]; then
            echo "::notice::NEON_API_KEY isn't set, nothing to delete."
            exit 0
          fi
          neonctl() { npx --yes neonctl@8.13.2 "$@"; }
          branch_id=$(neonctl branches list --project-id "$NEON_PROJECT_ID" --output json \
            | jq -r --arg name "$BRANCH_NAME" '(.branches? // .)[] | select(.name == $name) | .id')
          if [ -z "$branch_id" ]; then
            echo "No Neon branch named $BRANCH_NAME."
            exit 0
          fi
          neonctl branches delete "$branch_id" --project-id "$NEON_PROJECT_ID" --output json > /dev/null
          echo "Deleted $BRANCH_NAME ($branch_id)."
