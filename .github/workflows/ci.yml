# Checks every pull request and every push to main: lint, type check, format and the unit and
# component tests, which never reach a database (src/test/setup.ts) and need no secrets, and
# the integration tests of the SQL against a throwaway Neon database. Vercel's preview build is
# the build check. See docs/development/testing.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      # With coverage, so a large drop (tests deleted or skipped) fails the run.
      - run: pnpm test:coverage

  # The SQL in src/db against the TEST_DATABASE_URL secret: a Neon database whose name ends in
  # _test, wiped and migrated on every run. In mrghasemi1992/money the secret is required (in
  # Actions and in Dependabot's secrets), so a missing or deleted copy fails the job instead of
  # passing without tests. Pull requests from forks, which can't read secrets, and self-hosted
  # copies (forks running CI without it) skip the tests and pass: `pnpm test:db` does that.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every run uses the same database: one at a time, never cancelled halfway.
    concurrency:
      group: test-database
      cancel-in-progress: false
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # github.repository and the pull request's fork flag are set in Dependabot's runs too.
      - name: Require the secret in the upstream repository
        if: github.repository == 'mrghasemi1992/money' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then
            echo "::error::The TEST_DATABASE_URL secret is missing (Actions secrets, or Dependabot secrets for Dependabot's pull requests). See docs/development/testing.md#database-tests."
            exit 1
          fi
      - run: pnpm test:db
